name: Optimize production media

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without changing files or database"
        required: true
        type: boolean
        default: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Optimize media
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "
            set -Eeuo pipefail

            readonly REPO_DIR='/var/www/adamant-site'
            readonly APP_DIR='/var/www/adamant-site/adamant-next'
            readonly BACKUP_DIR='/var/backups/adamant-site'
            readonly NODE_BIN='/root/.nvm/versions/node/v24.15.0/bin'

            export PATH=\"\$NODE_BIN:\$PATH\"

            exec 9>'/var/lock/adamant-site-deploy.lock'
            flock -n 9 || {
              echo 'Another production deployment is already running.'
              exit 1
            }

            cd \"\$REPO_DIR\"
            git fetch origin main
            git merge --ff-only origin/main

            cd \"\$APP_DIR\"

            if [[ \"\$DRY_RUN\" != 'true' ]]; then
              timestamp=\$(date -u +%Y%m%d-%H%M%S)
              install -d -m 700 \"\$BACKUP_DIR\"
              cp --preserve=mode,timestamps adamant.db \"\$BACKUP_DIR/adamant-before-media-\$timestamp.db\"
              tar -czf \"\$BACKUP_DIR/media-before-media-\$timestamp.tar.gz\" media
            fi

            if [[ \"\$DRY_RUN\" == 'true' ]]; then
              node scripts/optimize-media-assets.mjs --dry-run
            else
              node scripts/optimize-media-assets.mjs
              pm2 restart adamant-site --update-env
              pm2 save
              curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            fi
          "
